name: Zameel Android APK

on:
  workflow_dispatch:
    inputs:
      signing:
        description: 'signed: production key + APK/AAB; test: temporary debug APK only'
        type: choice
        options:
          - signed
          - test
        default: signed
        required: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: https://jwuqyykjmltroneqtjoc.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_TC_UtlL14Q0LVhLejd27lQ_MZphnhlv
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      CM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      CM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      WEBRTC_TURN_URL: ${{ secrets.WEBRTC_TURN_URL }}
      WEBRTC_TURN_USERNAME: ${{ secrets.WEBRTC_TURN_USERNAME }}
      WEBRTC_TURN_CREDENTIAL: ${{ secrets.WEBRTC_TURN_CREDENTIAL }}
      CI: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: sdkmanager --install 'ndk;28.2.13676358'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Install Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo 'Missing GOOGLE_SERVICES_JSON_BASE64 secret'; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('android/app/google-services.json').read_text())
          assert config['project_info']['project_id'] == 'zameel-81ff6', 'Unexpected Firebase project'
          assert any(c['client_info']['android_client_info']['package_name'] == 'com.zameel.app'
                     for c in config['client']), 'Unexpected Android package'
          PY

      - name: Install release signing key
        if: inputs.signing == 'signed'
        shell: bash
        run: |
          set -euo pipefail
          for required in ANDROID_KEYSTORE_BASE64 CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD; do
            if [[ -z "${!required}" ]]; then
              echo "Missing GitHub Actions secret for $required"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks
          echo "CM_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Download Flutter dependencies and check sources
        run: |
          flutter pub get
          flutter analyze
          flutter analyze --no-fatal-infos
          dart verification/sponsored_feed_150_test.dart
          flutter test

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Google Play server and database contracts
        run: |
          node verification/academic_catalog_150_test.mjs
          dart verification/story_order_153_test.dart
          npm ci --prefix verification/play_billing_146 --ignore-scripts
          npm test --prefix verification/play_billing_146
          node --test verification/play_provider_146_test.mjs verification/play_purchase_146_test.mjs
          npm ci --prefix verification --ignore-scripts
          npm run test:153 --prefix verification

      - name: Build universal and device-specific APKs
        shell: bash
        run: |
          set -euo pipefail
          build_number=$((10031 + GITHUB_RUN_NUMBER))
          flutter build apk --release --build-number="$build_number" \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define="WEBRTC_TURN_URL=$WEBRTC_TURN_URL" \
            --dart-define="WEBRTC_TURN_USERNAME=$WEBRTC_TURN_USERNAME" \
            --dart-define="WEBRTC_TURN_CREDENTIAL=$WEBRTC_TURN_CREDENTIAL" \
            --dart-define=ZAMEEL_VERSION=2.0.15+24
          flutter build apk --release --split-per-abi --build-number="$build_number" \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define="WEBRTC_TURN_URL=$WEBRTC_TURN_URL" \
            --dart-define="WEBRTC_TURN_USERNAME=$WEBRTC_TURN_USERNAME" \
            --dart-define="WEBRTC_TURN_CREDENTIAL=$WEBRTC_TURN_CREDENTIAL" \
            --dart-define=ZAMEEL_VERSION=2.0.15+24

      - name: Build Android App Bundle for Google Play
        if: inputs.signing == 'signed'
        shell: bash
        run: |
          set -euo pipefail
          build_number=$((10031 + GITHUB_RUN_NUMBER))
          flutter build appbundle --release --build-number="$build_number" \
            --dart-define=ZAMEEL_GOOGLE_PLAY_BILLING=true \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define="WEBRTC_TURN_URL=$WEBRTC_TURN_URL" \
            --dart-define="WEBRTC_TURN_USERNAME=$WEBRTC_TURN_USERNAME" \
            --dart-define="WEBRTC_TURN_CREDENTIAL=$WEBRTC_TURN_CREDENTIAL" \
            --dart-define=ZAMEEL_VERSION=2.0.15+24

      - name: Check APK signature
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            "$apksigner" verify "$apk"
            certificate="$($apksigner verify --print-certs "$apk")"
            if [[ '${{ inputs.signing }}' == 'signed' ]] && grep -qi 'CN=Android Debug' <<< "$certificate"; then
              echo 'Production APK was signed with the Android Debug certificate'
              exit 1
            fi
          done
          if [[ '${{ inputs.signing }}' == 'signed' ]]; then
            test -s build/app/outputs/bundle/release/app-release.aab
            jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zameel-${{ inputs.signing }}-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Google Play AAB
        if: inputs.signing == 'signed'
        uses: actions/upload-artifact@v4
        with:
          name: zameel-signed-google-play-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
