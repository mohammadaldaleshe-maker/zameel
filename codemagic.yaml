# Zameel CI/CD - Codemagic
# Keep this file at the repository root.

workflows:
  android-test:
    name: Zameel Android Test APK
    max_build_duration: 60
    instance_type: linux_x2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      flutter: stable
      vars:
        SUPABASE_URL: "https://jwuqyykjmltroneqtjoc.supabase.co"
        SUPABASE_PUBLISHABLE_KEY: "sb_publishable_TC_UtlL14Q0LVhLejd27lQ_MZphnhlv"
        ZAMEEL_VERSION: "1.3.1"

    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze --no-pub
      - name: Build test APK
        script: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=ZAMEEL_VERSION="$ZAMEEL_VERSION"

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  android-internal:
    name: Zameel Android Internal Testing
    max_build_duration: 60
    instance_type: linux_x2

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    environment:
      flutter: stable
      android_signing:
        - zameel_upload_key
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.zameel.app"
        GOOGLE_PLAY_TRACK: "internal"
        SUPABASE_URL: "https://jwuqyykjmltroneqtjoc.supabase.co"
        SUPABASE_PUBLISHABLE_KEY: "sb_publishable_TC_UtlL14Q0LVhLejd27lQ_MZphnhlv"

    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze --no-pub
      - name: Build signed AAB
        script: |
          LATEST_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks="$GOOGLE_PLAY_TRACK" 2>/dev/null || true)
          if [ -n "$LATEST_BUILD_NUMBER" ]; then
            BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          else
            BUILD_NUMBER=17
          fi
          flutter build appbundle --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
